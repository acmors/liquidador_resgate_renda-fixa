server {
    listen 80;
    server_name acmors-developer.com.br www.acmors-developer.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name acmors-developer.com.br www.acmors-developer.com.br;

    ssl_certificate /etc/letsencrypt/live/acmors-developer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acmors-developer.com.br/privkey.pem;

    location /auth/ {
        proxy_pass http://cdb-auth-service:3001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/cdb/ {
        proxy_pass http://cdb-core-service:8080/api/v1/cdb/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}