version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cdb-postgres
    restart: always
    environment:
      POSTGRES_DB: cdb_database
      POSTGRES_USER: ${DB_USER:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: cdb-auth-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}

  cdb-core:
    build: ./liquidador-resgate-RF
    container_name: cdb-core-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_PORT}/cdb_database
      - SPRING_DATASOURCE_USERNAME=${DB_USER:postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_AUTH_API_URL=${VITE_AUTH_API_URL}
        - VITE_JAVA_API_URL=${VITE_JAVA_API_URL}
    container_name: cdb-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - auth-service
      - cdb-core

volumes:
  postgres_data: