name: Deploy Automático na VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "/root/liquidador_RF" ]; then
              git clone https://github.com/${{ github.repository }}.git /root/liquidador_RF
            fi

            cd /root/liquidador_RF

            git fetch --all
            git reset --hard origin/main

                cat <<EOF > .env
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            VITE_AUTH_API_URL=
            VITE_JAVA_API_URL=/api/v1/cdb
            EOF

            docker compose down
            docker compose up -d --build